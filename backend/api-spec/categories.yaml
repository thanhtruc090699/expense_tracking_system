paths:
  /categories:
    get:
      operationId: findAllCategories
      summary: Get all categories
      description: Returns all available categories that can be used to classify expenses and filter analytics.
      tags: [Categories]
      security:
        - keycloak: []
      responses:
        '200':
          description: Array of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
    post:
      operationId: createCategory
      summary: Create a category
      description: Creates a new category that can be assigned to expenses and used in budget or analytics views.
      tags: [Categories]
      security:
        - keycloak: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryDto'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '422':
          description: Unprocessable Entity - Invalid category input or missing required fields
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '409':
          description: Conflict - Category with the same name already exists
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
  /categories/{id}:
    get:
      operationId: findOneCategory
      summary: Get a category by ID
      description: Returns a single category by its UUID if it exists and the user is allowed to access it.
      tags: [Categories]
      security:
        - keycloak: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Category found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          description: Bad Request - Invalid category ID format
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
    put:
      operationId: updateCategory
      summary: Update a category
      description: Updates the name or icon of an existing category identified by its UUID.
      tags: [Categories]
      security:
        - keycloak: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryDto'
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          description: Bad Request - invalid category ID format
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '422':
          description: Unprocessable Entity - invalid category input
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '409':
          description: Conflict - Category with the same name already exists
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
    delete:
      operationId: deleteCategory
      summary: Delete a category
      description: Deletes an existing category by UUID if it is not still referenced by expenses, expense items, or budgets.
      tags: [Categories]
      security:
        - keycloak: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Category deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteCategory200Response'
        '400':
          description: Bad Request - invalid category ID format
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '409':
          description: Conflict - category is still used by expenses, expense items, or budgets
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'

components:
  schemas:
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        icon:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - createdAt
    CreateCategoryDto:
      type: object
      properties:
        name:
          type: string
        icon:
          type: string
      required:
        - name
    UpdateCategoryDto:
      type: object
      properties:
        name:
          type: string
        icon:
          type: string
    DeleteCategory200Response:
      type: object
      properties:
        message:
          type: string
