openapi: 3.0.3
info:
  title: Bill Buddy API - Lisa
  description: AI chat and data processing API
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Development server
paths:
  /lisa/chat:
    post:
      operationId: lisaChat
      summary: Chat with Lisa AI
      tags:
        - Lisa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Successful chat response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 400
                message: "Invalid request data"
                error: "Bad Request"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 401
                message: "Unauthorized access"
                error: "Unauthorized"
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 403
                message: "Forbidden access"
                error: "Forbidden"
        '408':
          description: Request timeout  
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 408
                message: "Request timed out"
                error: "Request Timeout"
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 422
                message: "Unprocessable entity"
                error: "Unprocessable Entity"
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 429
                message: "Too many requests"
                error: "Too Many Requests"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 500
                message: "An unexpected error occurred"
                error: "Internal Server Error"
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 503
                message: "Service is currently unavailable"
                error: "Service Unavailable"
        '504':
          description: Gateway timeout
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 504
                message: "Gateway timed out"
                error: "Gateway Timeout"
  /lisa/analyze-bill:
    post:
      operationId: lisaAnalyzeBill
      summary: Analyze bill data with Lisa AI
      tags:
        - Lisa
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                model:
                  type: string
                  default: lisa-pro-03-2026
                  description: Model to use for processing
                prompt:
                  type: string
                  description: Validate OCR results and extract item-level expense data
                file:
                  type: string
                  format: binary
                  description: Original bill image file for reference
              required:
                - file
      responses:
        '200':
          description: Successful processing response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 400
                message: "Invalid request data"
                error: "Bad Request"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 401
                message: "Unauthorized access"
                error: "Unauthorized"
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 403
                message: "Forbidden access"
                error: "Forbidden"
        '408':
          description: Request timeout
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 408
                message: "Request timed out"
                error: "Request Timeout"
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 422
                message: "Unprocessable entity"
                error: "Unprocessable Entity"
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 429
                message: "Too many requests"
                error: "Too Many Requests"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 500
                message: "An unexpected error occurred"
                error: "Internal Server Error"
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 503
                message: "Service is currently unavailable"
                error: "Service Unavailable"
        '504':
          description: Gateway timeout
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 504
                message: "Gateway timed out"
                error: "Gateway Timeout"
  /lisa/process-invoice:
    post:
      operationId: lisaProcessInvoice
      summary: create bill data with Lisa AI and persist invoice
      tags:
        - Lisa
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                model:
                  type: string
                  default: lisa-pro-03-2026
                  description: Model to use for processing
                prompt:
                  type: string
                  description: Validate OCR results and extract item-level expense data
                file:
                  type: string
                  format: binary
                  description: Original bill image file for reference
              required:
                - file
      responses:
        '201':
          description: Invoice validated and persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiProcessInvoiceResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '504':
          description: Gateway timeout
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
components:
  schemas:
    Message:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant, system]
        content:
          oneOf:
            - type: string
            - type: array
              items:
                oneOf:
                  - $ref: '#/components/schemas/TextContentPart'
                  - $ref: '#/components/schemas/ImageUrlContentPart'
      required:
        - role
        - content

    TextContentPart:
      type: object
      properties:
        type:
          type: string
          enum: [text]
        text:
          type: string
      required:
        - type
        - text

    ImageUrlContentPart:
      type: object
      properties:
        type:
          type: string
          enum: [image_url]
        image_url:
          type: object
          properties:
            url:
              type: string
          required:
            - url
      required:
        - type
        - image_url

    ChatRequest:
      type: object
      properties:
        model:
          type: string
          default: lisa-pro-03-2026
          description: Model to use for chat
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
          description: Array of chat messages
      required:
        - messages

    ChatResponse:
      type: object
      properties:
        id:
          type: string
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              message:
                $ref: '#/components/schemas/Message'
              finish_reason:
                type: string
        usage:
          type: object
          properties:
            prompt_tokens:
              type: integer
            completion_tokens:
              type: integer
            total_tokens:
              type: integer
      required:
        - id
        - model
        - choices

    ProcessResponse:
      type: object
      properties:
        invoice:
          $ref: '#/components/schemas/AiValidatedInvoice'
          description: Processed result from Lisa AI
      required:
        - invoice
    AiProcessInvoiceResponse:
      type: object
      properties:
        invoice:
          $ref: '#/components/schemas/AiProcessedInvoice'
          description: Validated invoice persisted to the database
      required:
        - invoice
    AiProcessedInvoice:
      type: object
      required:
        - expenseId
        - merchantId
        - merchantName
        - totalAmount
        - items
        - createdAt
      properties:
        expenseId:
          type: string
          format: uuid
        merchantId:
          type: string
          format: uuid
        merchantName:
          type: string
        totalAmount:
          type: number
        items:
          type: array
          items:
            $ref: './expense-items.yaml#/components/schemas/ExpenseItem'
        createdAt:
          type: string
          format: date-time
        validationStatus:
          type: string
          enum: [valid, needs_review, invalid]
    AiValidatedInvoice:
      type: object
      required:
        - merchant
        - totalAmount
        - items
        - validationStatus
      properties:
        merchant:
          type: string
          nullable: true
          description: Name of the merchant
        totalAmount:
          type: number
          format: float
          nullable: true
          description: Total amount on the bill
        date:
          type: string
          format: date
          description: Date of the transaction
        currency:
          type: string
          description: Currency code (e.g., USD, EUR)
        items:
          type: array
          items:
            $ref: '#/components/schemas/AiLisaExpenseItem'
          description: List of expense items extracted from the bill
        validationStatus:
          type: string
          enum: [valid, needs_review, invalid]
          description: Overall validation status of the bill
    AiLisaExpenseItem:
      type: object
      required:
        - name
        - quantity
        - unitPrice
        - totalPrice
      properties:
        name:
          type: string
          nullable: true
          description: Name or description of the expense item
        quantity:
          type: number
          nullable: true
          description: Quantity of the item purchased
        unitPrice:
          type: number
          format: float
          nullable: true
          description: Unit price of the item
        totalPrice:
          type: number
          format: float
          nullable: true
          description: Total price for the item (quantity * unit price)
        categoryName:
          type: string
          nullable: true
        categoryId:
          type: string
          format: uuid
          nullable: true
        confidence:
          type: number
          minimum: 0
          maximum: 1
        status:
          type: string
          enum: [ok, missing_price, uncertain]

