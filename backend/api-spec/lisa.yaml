openapi: 3.0.3
info:
  title: Bill Buddy API - Lisa
  description: AI chat and data processing API
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Development server
paths:
  /lisa/chat:
    post:
      operationId: lisaChat
      summary: Chat with Lisa AI
      tags:
        - Lisa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Successful chat response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 400
                message: "Invalid request data"
                error: "Bad Request"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 401
                message: "Unauthorized access"
                error: "Unauthorized"
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 403
                message: "Forbidden access"
                error: "Forbidden"
        '408':
          description: Request timeout  
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 408
                message: "Request timed out"
                error: "Request Timeout"
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 422
                message: "Unprocessable entity"
                error: "Unprocessable Entity"
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 429
                message: "Too many requests"
                error: "Too Many Requests"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 500
                message: "An unexpected error occurred"
                error: "Internal Server Error"
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 503
                message: "Service is currently unavailable"
                error: "Service Unavailable"
        '504':
          description: Gateway timeout
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 504
                message: "Gateway timed out"
                error: "Gateway Timeout"
  /lisa/process:
    post:
      operationId: lisaProcess
      summary: Process data with Lisa AI
      tags:
        - Lisa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessRequest'
      responses:
        '200':
          description: Successful processing response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 400
                message: "Invalid request data"
                error: "Bad Request"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 401
                message: "Unauthorized access"
                error: "Unauthorized"
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 403
                message: "Forbidden access"
                error: "Forbidden"
        '408':
          description: Request timeout
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 408
                message: "Request timed out"
                error: "Request Timeout"
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 422
                message: "Unprocessable entity"
                error: "Unprocessable Entity"
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 429
                message: "Too many requests"
                error: "Too Many Requests"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 500
                message: "An unexpected error occurred"
                error: "Internal Server Error"
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 503
                message: "Service is currently unavailable"
                error: "Service Unavailable"
        '504':
          description: Gateway timeout
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 504
                message: "Gateway timed out"
                error: "Gateway Timeout"
components:
  schemas:
    Message:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string
      required:
        - role
        - content

    ChatRequest:
      type: object
      properties:
        model:
          type: string
          default: lisa-pro-03-2026
          description: Model to use for chat
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
          description: Array of chat messages
      required:
        - messages

    ChatResponse:
      type: object
      properties:
        id:
          type: string
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              message:
                $ref: '#/components/schemas/Message'
              finish_reason:
                type: string
        usage:
          type: object
          properties:
            prompt_tokens:
              type: integer
            completion_tokens:
              type: integer
            total_tokens:
              type: integer
      required:
        - id
        - model
        - choices

    ProcessRequest:
      type: object
      properties:
        model:
          type: string
          default: lisa-pro-03-2026
          description: Model to use for processing
        task:
           type: string
           example: categorize_invoice
           description: Task type (e.g., "categorize_invoice", "validate_invoice")
           enum:
              - categorize_invoice
              - validate_invoice
              - suggest_budget
              - suggest_savings_tips
        data:
          type: object
          description: Data to process
        prompt:
          type: string
          description: Custom prompt for processing
      required:
        - data
        - task

    ProcessResponse:
      type: object
      properties:
        result:
          type: object
          description: Processed result from Lisa AI
      required:
        - result
