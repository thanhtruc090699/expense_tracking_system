paths:
  /expenses:
    get:
      operationId: findAllExpenses
      summary: Get all expenses
      tags: [Expenses]
      security:
        - keycloak: []
      parameters:
        - name: userId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Array of expenses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Expense'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
    post:
      operationId: createExpense
      summary: Create an expense
      tags: [Expenses]
      security:
        - keycloak: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExpenseDto'
      responses:
        '201':
          description: Expense created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '422':
          description: Unprocessable Entity - Invalid input
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
  /expenses/summary:
    get:
      operationId: fetchSummary
      summary: Get expense summary
      description: Retrieve expense summary statistics including total amount, transaction count, average transaction amount, and top 5 transactions for a specified month.
      tags: [Expenses]
      security:
        - keycloak: []
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: The month to get summary for (ISO 8601 format, e.g., 2024-01-01T00:00:00Z)
      responses:
        '200':
          description: Expense summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseSummary'
        '400':
          description: Invalid month parameter
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
  /expenses/{id}:
    get:
      operationId: findOneExpense
      summary: Get an expense by ID
      tags: [Expenses]
      security:
        - keycloak: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Expense found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '404':
          description: Expense not found
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
    put:
      operationId: updateExpense
      summary: Update an expense
      tags: [Expenses]
      security:
        - keycloak: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateExpenseDto'
      responses:
        '200':
          description: Expense updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '404':
          description: Expense not found
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '422':
          description: Unprocessable Entity - Invalid input
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
    delete:
      operationId: deleteExpense
      summary: Delete an expense
      tags: [Expenses]
      security:
        - keycloak: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Expense deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteExpense200Response'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '404':
          description: Expense not found
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'

components:
  schemas:
    Expense:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        merchantId:
          type: string
          format: uuid
          nullable: true
        totalAmount:
          type: number
          format: double
        expenseDate:
          type: string
          format: date-time
        isRecurring:
          type: boolean
          default: false
        note:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        merchant:
          $ref: './merchants.yaml#/components/schemas/Merchant'
        expenseItems:
          type: array
          items:
            $ref: './expense-items.yaml#/components/schemas/ExpenseItem'
      required:
        - id
        - userId
        - totalAmount
        - expenseDate
        - createdAt
    CreateExpenseDto:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        merchantId:
          type: string
          format: uuid
        totalAmount:
          type: number
          format: double
        expenseDate:
          type: string
          format: date-time
        isRecurring:
          type: boolean
          default: false
        note:
          type: string
      required:
        - userId
        - totalAmount
        - expenseDate
    UpdateExpenseDto:
      type: object
      properties:
        merchantId:
          type: string
        totalAmount:
          type: number
        expenseDate:
          type: string
          format: date-time
        isRecurring:
          type: boolean
        note:
          type: string
    DeleteExpense200Response:
      type: object
      properties:
        message:
          type: string
    ExpenseSummary:
      type: object
      properties:
        month:
          type: string
          format: date-time
          description: The month this summary represents
        totalAmount:
          type: number
          format: double
          description: Sum of all expenses for the month
        transactionCount:
          type: integer
          description: Number of transactions for the month
        averageTransactionAmount:
          type: number
          format: double
          description: Average transaction amount for the month
        topTransactions:
          type: array
          items:
            $ref: '#/components/schemas/Expense'
          description: Top 5 transactions by amount for the month
      required:
        - month
        - totalAmount
        - transactionCount
        - averageTransactionAmount
        - topTransactions
