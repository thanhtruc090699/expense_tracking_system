paths:
  /merchants:
    get:
      operationId: findAllMerchants
      summary: Get all merchants (for filtering expenses)
      description: Retrieve list of merchants that is used in the frontend to show a dropdown/filter list for users to view expenses from a specific merchant.
      tags: [Merchants]
      security:
        - keycloak: []
      responses:
        '200':
          description: Array of merchants the user has added expenses.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Merchant'
        '401':
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
    post:
      operationId: createMerchant
      summary: Create or get merchant
      description: Create a new merchant or return existing one if already exists (upsert behavior). Used in OCR extraction when processing bills and by users when manually adding expenses without uploading a bill.
      tags: [Merchants]
      security:
        - keycloak: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMerchantDto'
      responses:
        '201':
          description: Merchant created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merchant'
        '200':
          description: Merchant already exists (returned existing)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merchant'
        '400':
          description: Bad Request - merchant name is required or invalid
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '401':
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
  /merchants/search:
    get:
      operationId: searchMerchants
      summary: Search merchants by name
      description: Search for merchants by name to prevent duplicates and enable merchant selection. Used when users manually add/update expenses to find existing merchants before creating new ones.
      tags: [Merchants]
      security:
        - keycloak: []
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
          description: Partial merchant name to search for (e.g., 'star' finds 'Starbucks')
      responses:
        '200':
          description: Array of matching merchants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Merchant'
        '400':
          description: Bad Request - name parameter is required
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '401':
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
  /merchants/{id}:
    get:
      operationId: findOneMerchant
      summary: Get a merchant by ID (internal backend use)
      description: Retrieve a specific merchant by ID. Used when fetching expense details or for validation. No direct use in frontend.
      tags: [Merchants]
      security:
        - keycloak: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Merchant found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merchant'
        '401':
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '404':
          description: Merchant not found
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
    put:
      operationId: updateMerchant
      summary: Correct merchant name
      description: Allow user to correct/fix merchant names when OCR extraction made errors. Users can search for existing merchants before updating to avoid creating duplicates.
      tags: [Merchants]
      security:
        - keycloak: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMerchantDto'
      responses:
        '200':
          description: Merchant updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merchant'
        '400':
          description: Bad Request - merchant name is required or invalid
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '401':
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '404':
          description: Merchant not found
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '409':
          description: Conflict - another merchant already has this name
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'

components:
  schemas:
    Merchant:
      type: object
      description: Merchant extracted from bills/receipts
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Merchant name extracted from receipt (e.g., 'Amazon', 'Kaufland')
      required:
        - id
        - name
    CreateMerchantDto:
      type: object
      description: DTO for creating a merchant. Used by OCR extraction to add new merchants.
      properties:
        name:
          type: string
          description: Merchant name to create
      required:
        - name
    UpdateMerchantDto:
      type: object
      description: DTO for updating merchant name. Used to fix OCR extraction errors or merge duplicates.
      properties:
        name:
          type: string
          description: Corrected merchant name
