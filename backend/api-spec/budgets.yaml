paths:
  /budgets:
    get:
      operationId: findAllBudgets
      summary: Get all budgets
      description: Retrieve all budgets for the authenticated user. If a userId query parameter is provided, only budgets for that user will be returned. If no userId is provided, budgets for all users will be returned (admin only).
      tags: 
        - Budgets
      security:
        - keycloak: []
      parameters:
        - name: userId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Array of budgets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Budget'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 401
                message: Unauthorized
                error: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 403
                message: Forbidden
                error: Forbidden
        
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 500
                message: Internal Server Error
                error: Internal Server Error
    post:
      operationId: createBudget
      summary: Create a budget
      description: Create a new budget for the authenticated user. The categoryId is optional, but if provided, it must be unique for the user. If a budget with the same categoryId already exists for the user, a 409 Conflict error will be returned.
      tags: 
        - Budgets
      security:
        - keycloak: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBudgetDto'
      responses:
        '201':
          description: Budget created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 401
                message: Unauthorized
                error: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 403
                message: Forbidden
                error: Forbidden
        
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 409
                message: Conflict - Budget for this category already exists
                error: Conflict
        '422':
          description: Validation Failed
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 422
                message: Validation Failed - Invalid input data
                error: Validation Failed
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 500
                message: Internal Server Error
                error: Internal Server Error
  /budgets/{id}:
    get:
      operationId: findOneBudget
      summary: Get a budget by ID
      description: Retrieve a single budget by its ID. The budget must belong to the authenticated user or the user must have admin privileges to access it.
      tags: 
        - Budgets
      security:
        - keycloak: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Budget found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
        '404':
          description: Budget not found
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 404
                message: Budget not found
                error: Not Found
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 401
                message: Unauthorized
                error: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 403
                message: Forbidden
                error: Forbidden
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 500
                message: Internal Server Error
                error: Internal Server Error
    put:
      operationId: updateBudget
      summary: Update a budget
      description: Update an existing budget for the authenticated user. The budget must belong to the authenticated user or the user must have admin privileges to update it.
      tags: 
        - Budgets
      security:
        - keycloak: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBudgetDto'
      responses:
        '200':
          description: Budget updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
        
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 401
                message: Unauthorized
                error: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 403
                message: Forbidden
                error: Forbidden
        '404':
          description: Budget not found
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 404
                message: Budget not found
                error: Not Found
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 409
                message: Budget for this category already exists
                error: Conflict
        '422':
          description: Validation Failed
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 422
                message: Validation Failed - Invalid input data
                error: Validation Failed
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 500
                message: Internal Server Error
                error: Internal Server Error
    patch:
      operationId: partiallyUpdateBudget
      summary: Partially update a budget
      description: Partially update an existing budget for the authenticated user. The budget must belong to the authenticated user or the user must have admin privileges to update it. Only the fields provided in the request body will be updated.
      tags: 
        - Budgets
      security:
        - keycloak: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartiallyUpdateBudgetDto'
      responses:
        '200':
          description: Budget partially updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
        
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 401
                message: Unauthorized
                error: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 403
                message: Forbidden
                error: Forbidden
        '404':
          description: Budget not found
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 404
                message: Budget not found
                error: Not Found
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 409
                message: Budget for this category already exists
                error: Conflict
        '422':
          description: Validation Failed
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 422
                message: Validation Failed - Invalid input data
                error: Validation Failed
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 500
                message: Internal Server Error
                error: Internal Server Error
    delete:
      operationId: deleteBudget
      summary: Delete a budget
      description: Delete an existing budget for the authenticated user. The budget must belong to the authenticated user or the user must have admin privileges to delete it.
      tags: 
        - Budgets
      security:
        - keycloak: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Budget deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteBudget200Response'
        
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 401
                message: Unauthorized
                error: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 403
                message: Forbidden
                error: Forbidden
        '404':
          description: Budget not found
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 404
                message: Budget not found
                error: Not Found
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                statusCode: 500
                message: Internal Server Error
                error: Internal Server Error

components:
  schemas:
    Budget:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
          nullable: true
        amount:
          type: number
          format: double
        notifyThreshold:
          type: number
          format: double
        endDate:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        category:
          $ref: './categories.yaml#/components/schemas/Category'
      required:
        - id
        - userId
        - amount
        - notifyThreshold
        - createdAt
    CreateBudgetDto:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        amount:
          type: number
          format: double
        notifyThreshold:
          type: number
          format: double
        endDate:
          type: string
          format: date-time
      required:
        - amount
        - notifyThreshold
    UpdateBudgetDto:
      type: object
      properties:
        categoryId:
          type: string
        amount:
          type: number
        notifyThreshold:
          type: number
        endDate:
          type: string
          format: date-time
      required: 
        - amount
        - notifyThreshold
        - endDate
        - categoryId
    PartiallyUpdateBudgetDto:
      type: object
      properties:
        categoryId:
          type: string
        amount:
          type: number
        notifyThreshold:
          type: number
        endDate:
          type: string
          format: date-time
    DeleteBudget200Response:
      type: object
      properties:
        message:
          type: string
