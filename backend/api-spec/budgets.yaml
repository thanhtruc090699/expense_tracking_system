              example:
                statusCode: 500
                message: Internal Server Error
                error: Internal Server Error

components:
  schemas:
    Budget:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
          nullable: true
        amount:
          type: number
          format: double
        notifyThreshold:
          type: number
          format: double
        endDate:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        category:
          $ref: './categories.yaml#/components/schemas/Category'
      required:
        - id
        - userId
        - amount
        - notifyThreshold
        - createdAt
    CreateBudgetDto:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        amount:
          type: number
          format: double
        notifyThreshold:
          type: number
          format: double
        endDate:
          type: string
          format: date-time
      required:
        - userId
        - amount
        - notifyThreshold
    UpdateBudgetDto:
      type: object
      properties:
        categoryId:
          type: string
        amount:
          type: number
        notifyThreshold:
          type: number
        endDate:
          type: string
          format: date-time
    DeleteBudget200Response:
      type: object
      properties:
        message:
          type: string
