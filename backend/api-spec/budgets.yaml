paths:
  /budgets:
    get:
      operationId: findAllBudgets
      summary: Get all budgets
      tags: [Budgets]
      security:
        - keycloak: []
      parameters:
        - name: userId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Array of budgets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Budget'
    post:
      operationId: createBudget
      summary: Create a budget
      tags: [Budgets]
      security:
        - keycloak: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBudgetDto'
      responses:
        '201':
          description: Budget created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
  /budgets/{id}:
    get:
      operationId: findOneBudget
      summary: Get a budget by ID
      tags: [Budgets]
      security:
        - keycloak: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Budget found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
        '404':
          description: Budget not found
          content:
            application/json:
              schema:
                $ref: './lisa.yaml#/components/schemas/Error'
    put:
      operationId: updateBudget
      summary: Update a budget
      tags: [Budgets]
      security:
        - keycloak: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBudgetDto'
      responses:
        '200':
          description: Budget updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
    delete:
      operationId: deleteBudget
      summary: Delete a budget
      tags: [Budgets]
      security:
        - keycloak: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Budget deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteBudget200Response'

components:
  schemas:
    Budget:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
          nullable: true
        amount:
          type: number
          format: double
        notifyThreshold:
          type: number
          format: double
        endDate:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        category:
          $ref: './categories.yaml#/components/schemas/Category'
      required:
        - id
        - userId
        - amount
        - notifyThreshold
        - createdAt
    CreateBudgetDto:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        amount:
          type: number
          format: double
        notifyThreshold:
          type: number
          format: double
        endDate:
          type: string
          format: date-time
      required:
        - userId
        - amount
        - notifyThreshold
    UpdateBudgetDto:
      type: object
      properties:
        categoryId:
          type: string
        amount:
          type: number
        notifyThreshold:
          type: number
        endDate:
          type: string
          format: date-time
    DeleteBudget200Response:
      type: object
      properties:
        message:
          type: string
