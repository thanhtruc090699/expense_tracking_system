paths:
  /budgets:
    get:
      operationId: findAllBudgets
      summary: Get all budgets
      tags: [Budgets]
      security:
        - keycloak: []
      parameters:
        - name: userId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Array of budgets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Budget'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './lisa.yaml#/components/schemas/Error'
              example:
                statusCode: 401
                message: Unauthorized
                error: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: './lisa.yaml#/components/schemas/Error'
              example:
                statusCode: 403
                message: Forbidden
                error: Forbidden
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: './lisa.yaml#/components/schemas/Error'
              example:
                statusCode: 400
                message: Bad Request
                error: Bad Request
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: './lisa.yaml#/components/schemas/Error'
              example:
                statusCode: 500
                message: Internal Server Error
                error: Internal Server Error
    post:
      operationId: createBudget
      summary: Create a budget
      tags: [Budgets]
      security:
        - keycloak: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBudgetDto'
      responses:
        '201':
          description: Budget created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './lisa.yaml#/components/schemas/Error'
              example:
                statusCode: 401
                message: Unauthorized
                error: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: './lisa.yaml#/components/schemas/Error'
              example:
                statusCode: 403
                message: Forbidden
                error: Forbidden
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: './lisa.yaml#/components/schemas/Error'
              example:
                statusCode: 400
                message: Bad Request
                error: Bad Request
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: './lisa.yaml#/components/schemas/Error'
              example:
                statusCode: 409
                message: Conflict - Budget for this category already exists
                error: Conflict
        '422':
          description: Validation Failed
          content:
            application/json:
              schema:
                $ref: './lisa.yaml#/components/schemas/Error'
              example:
                statusCode: 422
                message: Validation Failed - Invalid input data
                error: Validation Failed
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: './lisa.yaml#/components/schemas/Error'
              example:
                statusCode: 500
                message: Internal Server Error
                error: Internal Server Error
  /budgets/{id}:
    get:
      operationId: findOneBudget
      summary: Get a budget by ID
      tags: [Budgets]
      security:
        - keycloak: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Budget found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
        '404':
          description: Budget not found
          content:
            application/json:
              schema:
                $ref: './lisa.yaml#/components/schemas/Error'
                example:
                  statusCode: 404
                  message: Budget not found
                  error: Not Found
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: './lisa.yaml#/components/schemas/Error'
              example:
                statusCode: 400
                message: Bad Request
                error: Bad Request
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './lisa.yaml#/components/schemas/Error'
              example:
                statusCode: 401
                message: Unauthorized
                error: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: './lisa.yaml#/components/schemas/Error'
              example:
                statusCode: 403
                message: Forbidden
                error: Forbidden
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: './lisa.yaml#/components/schemas/Error'
              example:
                statusCode: 500
                message: Internal Server Error
                error: Internal Server Error
    put:
      operationId: updateBudget
      summary: Update a budget
      tags: [Budgets]
      security:
        - keycloak: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBudgetDto'
      responses:
        '200':
          description: Budget updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: './lisa.yaml#/components/schemas/Error'
              example:
                statusCode: 400
                message: Bad Request
                error: Bad Request
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './lisa.yaml#/components/schemas/Error'
              example:
                statusCode: 401
                message: Unauthorized
                error: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: './lisa.yaml#/components/schemas/Error'
              example:
                statusCode: 403
                message: Forbidden
                error: Forbidden
        '404':
          description: Budget not found
          content:
            application/json:
              schema:
                $ref: './lisa.yaml#/components/schemas/Error'
              example:
                statusCode: 404
                message: Budget not found
                error: Not Found
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: './lisa.yaml#/components/schemas/Error'
              example:
                statusCode: 409
                message: Budget for this category already exists
                error: Conflict
        '422':
          description: Validation Failed
          content:
            application/json:
              schema:
                $ref: './lisa.yaml#/components/schemas/Error'
              example:
                statusCode: 422
                message: Validation Failed - Invalid input data
                error: Validation Failed
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: './lisa.yaml#/components/schemas/Error'
              example:
                statusCode: 500
                message: Internal Server Error
                error: Internal Server Error
    patch:
      operationId: partiallyUpdateBudget
      summary: Partially update a budget
      tags: [Budgets]
      security:
        - keycloak: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBudgetDto'
      responses:
        '200':
          description: Budget partially updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: './lisa.yaml#/components/schemas/Error'
              example:
                statusCode: 400
                message: Bad Request
                error: Bad Request
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './lisa.yaml#/components/schemas/Error'
              example:
                statusCode: 401
                message: Unauthorized
                error: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: './lisa.yaml#/components/schemas/Error'
              example:
                statusCode: 403
                message: Forbidden
                error: Forbidden
        '404':
          description: Budget not found
          content:
            application/json:
              schema:
                $ref: './lisa.yaml#/components/schemas/Error'
              example:
                statusCode: 404
