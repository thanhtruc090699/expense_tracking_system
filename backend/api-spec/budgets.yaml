                error: Not Found
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: './lisa.yaml#/components/schemas/Error'
              example:
                statusCode: 409
                message: Budget for this category already exists
                error: Conflict
        '422':
          description: Validation Failed
          content:
            application/json:
              schema:
                $ref: './lisa.yaml#/components/schemas/Error'
              example:
                statusCode: 422
                message: Validation Failed - Invalid input data
                error: Validation Failed
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: './lisa.yaml#/components/schemas/Error'
              example:
                statusCode: 500
                message: Internal Server Error
                error: Internal Server Error
    delete:
      operationId: deleteBudget
      summary: Delete a budget
      tags: [Budgets]
      security:
        - keycloak: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Budget deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteBudget200Response'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: './lisa.yaml#/components/schemas/Error'
              example:
                statusCode: 400
                message: Bad Request
                error: Bad Request
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './lisa.yaml#/components/schemas/Error'
              example:
                statusCode: 401
                message: Unauthorized
                error: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: './lisa.yaml#/components/schemas/Error'
              example:
                statusCode: 403
                message: Forbidden
                error: Forbidden
        '404':
          description: Budget not found
          content:
            application/json:
              schema:
                $ref: './lisa.yaml#/components/schemas/Error'
              example:
                statusCode: 404
